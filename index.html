<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sofia Solar // Portfolio & Creative Direction</title>
  <meta name="description" content="Sofia Solar: Edición, guiones, dirección estética y estrategia para marcas y creadores. Moda, video, contenido, DJ y tarot.">

  <!-- Typography: Editorial High-Contrast Serif (Cormorant Garamond) & Minimalist Neo-Grotesque (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=final2">
</head>
<body>

  <!-- =========================================================================
       LIVING ATMOSPHERIC BACKGROUND (MESH GRADIENTS & FILM GRAIN NOISE)
       ========================================================================= -->
  <div class="living-bg-container" id="living-bg-container" aria-hidden="true">
    <div class="parallax-aura-layer" id="parallax-aura-layer">
      <div class="mesh-aura aura-violet"></div>
      <div class="mesh-aura aura-magenta"></div>
      <div class="mesh-aura aura-cyan"></div>
    </div>
    <div class="film-grain-overlay"></div>
  </div>

  <!-- =========================================================================
       1. VISTA PRINCIPAL: HOME & LINKTREE EDITORIAL DARK MODE
       ========================================================================= -->
  <main id="home-view" class="view-screen active linktree-layout">

    <!-- 3. Language Switcher (Top Corner) + Theme Toggle Button -->
    <header class="top-nav-bar">
      <div class="lang-switcher" aria-label="Selector de idioma / Language Switcher">
        <button class="lang-btn active" data-lang="es">ES</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="en">EN</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Modo Sol / Noche" title="Cambiar tema">
        <span id="theme-icon-indicator" class="theme-icon">☀️</span>
      </button>
    </header>

    <div class="linktree-card-wrapper">
      
      <!-- 4. Hero Header: Circular B&W Avatar with Subtle Inner Border -->
      <div class="avatar-container">
        <img id="profile-img" src="fotodeperfil.jpeg" alt="Sofia Solar" class="avatar-image">
      </div>

      <!-- Main Title: Cormorant Garamond Editorial Serif -->
      <h1 id="profile-name" class="profile-name">Sofia Solar</h1>

      <!-- Bio Subtitle in Silver-Grey #A8A8A8 (Dynamically translated) -->
      <p id="profile-subtitle" class="profile-subtitle">
        Edición, guiones, dirección estética y estrategia para marcas y creadores.
      </p>

      <!-- 4. Interactive Role Clouds: 5 Pill-Shaped Plastic Bubbles -->
      <div class="role-pills-cluster" id="role-pills-cluster" aria-label="Especialidades y Roles">
        <button class="role-pill-btn" data-role="moda">Productora de Moda & Estilista</button>
        <button class="role-pill-btn" data-role="editora">Editora de Video</button>
        <button class="role-pill-btn" data-role="creadora">Creadora de Contenido</button>
        <button class="role-pill-btn" data-role="dj">DJ</button>
        <button class="role-pill-btn" data-role="tarot">Tarotista</button>
      </div>

      <!-- 5. Social Icons Row + Glowing Emerald $ Pricing Bubble -->
      <!-- Strictly Ordered: 1. WhatsApp -> 2. Mail -> 3. Instagram -> 4. YouTube -> 5. Precios ($) -->
      <div class="social-row">
        
        <!-- 1. WhatsApp (White SVG) -->
        <a id="link-wa" href="#" target="_blank" rel="noopener noreferrer" class="social-bubble-btn btn-wa" aria-label="WhatsApp">
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
        </a>

        <!-- 2. Mail (mailto:sofiadenisse.lab@gmail.com with Clean SVG) -->
        <a id="link-mail" href="mailto:sofiadenisse.lab@gmail.com" class="social-bubble-btn btn-mail" aria-label="Email">
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>

        <!-- 3. Instagram (Original SVG) -->
        <a id="link-ig" href="https://instagram.com/" target="_blank" rel="noopener noreferrer" class="social-bubble-btn btn-ig" aria-label="Instagram">
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>

        <!-- 4. YouTube (Original SVG) -->
        <a id="link-yt" href="https://youtube.com/" target="_blank" rel="noopener noreferrer" class="social-bubble-btn btn-yt" aria-label="YouTube">
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>

        <!-- 5. Glowing Emerald $ Pricing Bubble -->
        <button id="open-pricing-bubble-btn" class="pricing-bubble-btn btn-price-green" aria-label="Abrir Tarifario">
          <span class="currency-symbol">$</span>
        </button>
      </div>

      <!-- 5. Bottom Nested Category Menu (4 Buttons with Unified Dropdown Chevrons ▾) -->
      <nav class="nested-menu-container" id="nested-menu-container" aria-label="Menú de Portafolios y Secciones">
        <!-- Inyectado dinámicamente con chevrones minimalistas limpios -->
      </nav>

      <!-- 6. Footer Status -->
      <footer class="linktree-footer">
        <button class="footer-pricing-shortcut" onclick="openPricingModal()">
          <span class="footer-dot"></span>
          <span id="footer-status-text">Disponible para nuevos proyectos · Ver tarifas</span>
        </button>
      </footer>

    </div>
  </main>


  <!-- =========================================================================
       EXPANDABLE SUB-CLOUD MODAL / FLOATING GLASS DRAWER
       ========================================================================= -->
  <div id="role-modal-backdrop" class="sheet-backdrop role-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div id="role-modal" class="role-modal-card">
      <button id="close-role-modal-btn" class="modal-close-btn" aria-label="Cerrar detalles">✕</button>
      <div id="role-modal-body" class="role-modal-body">
        <!-- Injected dynamically without literal section tags -->
      </div>
    </div>
  </div>


  <!-- =========================================================================
       INSTAGRAM-STYLE CAROUSEL INTERFACE (MODA & MUNDO ESOTÉRICO)
       ========================================================================= -->
  <section id="carousel-view" class="view-screen">
    <div class="carousel-device-wrapper">
      
      <!-- Carousel Top Bar -->
      <nav class="carousel-top-bar">
        <button id="back-from-carousel-btn" class="feed-nav-btn btn-back" aria-label="Volver">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span id="carousel-back-text">Volver</span>
        </button>

        <div class="carousel-header-info">
          <span class="carousel-project-title" id="carousel-title">CIRIART</span>
          <span class="carousel-counter-badge" id="carousel-counter">1/4</span>
        </div>

        <button class="feed-nav-btn btn-pricing-feed-green" onclick="openPricingModal()" aria-label="Tarifario">
          <span class="feed-dollar-icon">$</span>
        </button>
      </nav>

      <!-- Main Swipable Image Container -->
      <div class="carousel-slider" id="carousel-slider">
        <!-- Injected dynamically -->
      </div>

      <!-- Navigation Arrows for desktop -->
      <button class="carousel-arrow arrow-left" id="carousel-prev-btn" aria-label="Anterior">‹</button>
      <button class="carousel-arrow arrow-right" id="carousel-next-btn" aria-label="Siguiente">›</button>

      <!-- Bottom Card: Indicators & Editorial Caption -->
      <div class="carousel-bottom-box">
        <div class="carousel-dots-row" id="carousel-dots">
          <!-- Dots dynamically rendered -->
        </div>
        <p class="carousel-caption" id="carousel-caption"></p>
      </div>

    </div>
  </section>


  <!-- =========================================================================
       TIKTOK VERTICAL VIDEO FEED VIEW (VIDEOFOLIO & SOUND & SETS)
       ========================================================================= -->
  <section id="feed-view" class="view-screen">
    <div class="feed-device-wrapper">
      
      <nav class="feed-top-bar">
        <button id="back-to-home-btn" class="feed-nav-btn btn-back" aria-label="Volver al menú">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span id="feed-back-text">Volver</span>
        </button>

        <div class="current-project-badge" id="feed-current-category-title">
          Social media
        </div>

        <div class="feed-top-actions">
          <button id="sound-toggle-btn" class="feed-nav-btn btn-sound" aria-label="Alternar sonido">
            <span id="sound-icon-box">🔇</span>
            <span id="sound-label">Muted</span>
          </button>
          
          <button class="feed-nav-btn btn-pricing-feed-green" onclick="openPricingModal()" aria-label="Tarifario">
            <span class="feed-dollar-icon">$</span>
          </button>
        </div>
      </nav>

      <div id="swipe-hint" class="swipe-hint">
        <div class="swipe-icon-anim">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 11 12 6 7 11"></polyline>
            <polyline points="17 18 12 13 7 18"></polyline>
          </svg>
        </div>
        <span id="swipe-hint-text">Deslizá hacia arriba</span>
      </div>

      <div id="play-pause-indicator" class="play-pause-indicator">
        <div class="indicator-icon-box" id="indicator-icon-box">▶</div>
      </div>

      <div class="feed-scroll-container" id="feed-scroll-container">
        <!-- Injected dynamically -->
      </div>

    </div>
  </section>



  <!-- =========================================================================
       PRICING MODAL — IMMERSIVE TABBED TARIFARIO
       ========================================================================= -->
  <div id="pricing-sheet-backdrop" class="sheet-backdrop">
    <div id="pricing-sheet" class="pricing-sheet" role="dialog" aria-modal="true" aria-labelledby="pricing-title">

      <!-- Liquid 3D aurora orbs inside modal -->
      <div class="modal-aurora" aria-hidden="true">
        <div class="modal-orb modal-orb-violet"></div>
        <div class="modal-orb modal-orb-magenta"></div>
        <div class="modal-orb modal-orb-cyan"></div>
      </div>

      <div class="sheet-drag-handle"></div>

      <div class="sheet-header">
        <div>
          <div class="sheet-tag" id="pricing-sheet-tag">TARIFARIO</div>
          <h2 id="pricing-title" class="sheet-title">Servicios &amp; Paquetes</h2>
        </div>
        <button id="close-pricing-btn" class="sheet-close-btn" aria-label="Cerrar tarifario">&#x2715;</button>
      </div>

      <!-- Category Tab Nav -->
      <nav class="pricing-tabs-nav" id="pricing-tabs-nav" aria-label="Categorías de servicios">
        <button class="pricing-tab active" data-pricing-tab="video">Edición de Video</button>
        <button class="pricing-tab" data-pricing-tab="contenido">Creadora de Contenido</button>
        <button class="pricing-tab" data-pricing-tab="moda">Producción de Moda</button>
        <button class="pricing-tab" data-pricing-tab="tarot">Tarot</button>
      </nav>

      <!-- Dynamic content panel -->
      <div class="pricing-panel" id="pricing-panel">
        <!-- Injected dynamically from app.js -->
      </div>

      <div class="sheet-footer">
        <a id="whatsapp-cta-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-whatsapp-main">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
          <div class="btn-text-group">
            <span class="btn-primary-text" id="whatsapp-btn-text">Consultar por WhatsApp</span>
            <span class="btn-secondary-text" id="whatsapp-btn-sub">Respond&#233; directo con tu consulta</span>
          </div>
        </a>
      </div>

    </div>
  </div>

  <script src="app.js?v=final2"></script>
</body>
</html>
